<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Wine Store</title>
  <style>
    :root {
      --brand-color: #aa152c;
      --bg-color: #f9f8f6;
      --text-main: #1e1e1e;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .brand {
      color: var(--brand-color);
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }
    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .input-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .input-group input:focus {
      outline: none;
      border-color: var(--brand-color);
    }
    .btn-submit {
      width: 100%;
      background-color: var(--brand-color);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }
    .btn-submit:hover {
      background-color: #8a1023;
    }
    .message-box {
      margin-top: 15px;
      font-size: 0.9rem;
      display: none;
    }
    .error { color: #d9534f; }
    .success { color: #5cb85c; }
    .link-text {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #666;
    }
    .link-text a {
      color: var(--brand-color);
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand">WINE STORE</div>
    <div class="subtitle">Welcome back! Please log in</div>
    
    <form id="loginForm">
      <div class="input-group">
        <input type="email" id="email" placeholder="Email address" required>
      </div>
      <div class="input-group">
        <input type="password" id="password" placeholder="Password" required>
      </div>
      <button type="submit" class="btn-submit">Log In</button>
    </form>

    <div id="message" class="message-box"></div>

    <div class="link-text">
      Don't have an account? <a href="signup.html">Sign up</a>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const messageDiv = document.getElementById('message');

    loginForm.addEventListener('submit', async function (e) {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          messageDiv.className = "message-box success";
          messageDiv.innerText = "Login successful! Redirecting...";
          messageDiv.style.display = "block";
          
          // บันทึกสถานะการล็อกอินไว้ที่ localStorage
          localStorage.setItem('user', JSON.stringify(data.user));

          setTimeout(() => {
            window.location.href = "store.html"; // หรือหน้าแรกหลังจาก login
          }, 1000);
        } else {
          messageDiv.className = "message-box error";
          messageDiv.innerText = data.error || "Invalid credentials.";
          messageDiv.style.display = "block";
        }
      } catch (err) {
        messageDiv.className = "message-box error";
        messageDiv.innerText = "Error connecting to server.";
        messageDiv.style.display = "block";
      }
    });
  </script>

</body>
</html>
