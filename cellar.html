<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Wine Collection</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #faf8f5;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      border: 1px solid #eae5de;
    }

    h1 {
      text-align: center;
      color: #aa152c;
      font-size: 1.8rem;
      margin-bottom: 25px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 15px;
    }

    .form-group.full {
      grid-column: span 2;
    }

    input,
    select {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #dcd6cd;
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fff;
      outline: none;
      box-sizing: border-box;
    }

    input:focus,
    select:focus {
      border-color: #aa152c;
    }

    .btn-submit {
      grid-column: span 2;
      background: #aa152c;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background: #8b1022;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #666;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link:hover {
      color: #aa152c;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🍷 Wine Collection</h1>
    <form id="addWineForm" onsubmit="submitWine(event)">
      <!-- เพิ่มช่องกรอก Winery แยกออกมาต่างหาก -->
      <div class="form-group full">
        <input type="text" id="winery" placeholder="Winery / Producer (e.g. Andrew Januik, B Cellars)" required>
      </div>
      <div class="form-group full">
        <input type="text" id="name" placeholder="Wine Name (e.g. Stone Cairn Cabernet Sauvignon 2013)" required>
      </div>
      <div class="form-group">
        <select id="type" required>
          <option value="" disabled selected>Select Type</option>
          <option value="Red">Red</option>
          <option value="White">White</option>
          <option value="Sparkling">Sparkling</option>
          <option value="Rosé">Rosé</option>
          <option value="Dessert">Dessert</option>
          <option value="Fortified">Fortified</option>
        </select>
      </div>
      <div class="form-group">
        <input type="text" id="region" placeholder="Region / Country (e.g. Bordeaux, France)">
      </div>
      <div class="form-group">
        <input type="number" id="price" placeholder="Price (THB)" required>
      </div>
      <div class="form-group">
        <input type="number" step="0.1" id="rating" placeholder="Rating (1.0 - 5.0)" min="1" max="5">
      </div>
      <div class="form-group full">
        <input type="text" id="image" placeholder="Image URL (e.g. https://...)">
      </div>
      <button type="submit" class="btn-submit">Add Wine to Cellar</button>
    </form>
  </div>

  <a href="wines.html" class="back-link">← Back to Wines Catalog</a>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const wineId = urlParams.get('id');

      // ถ้ามี id ส่งมาใน URL แปลว่าเป็นการ "แก้ไขข้อมูล" (Edit Mode)
      if (wineId) {
        document.querySelector('h1').innerText = '✏️ Edit Wine Collection';
        document.querySelector('.btn-submit').innerText = 'Update Wine';

        try {
          const res = await fetch(`/api/wines`);
          const wines = await res.json();
          const wine = wines.find(w => w.id == wineId);

          if (wine) {
            document.getElementById('winery').value = wine.winery || '';
            document.getElementById('name').value = wine.name;
            document.getElementById('type').value = wine.type;
            document.getElementById('region').value = `${wine.region || ''}, ${wine.country || ''}`;
            document.getElementById('price').value = wine.price;
            document.getElementById('rating').value = wine.rating;
            document.getElementById('image').value = wine.image;
          }
        } catch (err) {
          console.error('Error loading wine data:', err);
        }
      }
    });

    async function submitWine(e) {
      e.preventDefault();

      const regionInput = document.getElementById('region').value;
      let region = regionInput;
      let country = '';

      if (regionInput.includes(',')) {
        const parts = regionInput.split(',');
        region = parts[0].trim();
        country = parts[1].trim();
      } else {
        country = regionInput.trim();
      }

      const data = {
        winery: document.getElementById('winery').value.trim(),
        name: document.getElementById('name').value.trim(),
        type: document.getElementById('type').value,
        region: region,
        country: country || 'France',
        price: parseFloat(document.getElementById('price').value),
        rating: parseFloat(document.getElementById('rating').value) || 4.5,
        ratings_count: Math.floor(Math.random() * 500) + 50,
        image: document.getElementById('image').value.trim() || 'https://images.vivino.com/thumbs/0068ba2p910000_300x600.png'
      };

      const urlParams = new URLSearchParams(window.location.search);
      const wineId = urlParams.get('id');

      // เช็กว่าจะใช้เมธอด POST (เพิ่มใหม่) หรือ PUT (อัปเดต)
      const method = wineId ? 'PUT' : 'POST';
      const url = wineId ? `/api/wines/${wineId}` : '/api/wines';

      try {
        const res = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          alert(wineId ? 'Wine updated successfully!' : 'Wine added successfully!');
          window.location.href = 'wines.html';
        } else {
          alert('Failed to save wine data.');
        }
      } catch (err) {
        console.error(err);
        alert('An error occurred.');
      }
    }
  </script>

</body>

</html>
