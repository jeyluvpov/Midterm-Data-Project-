<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Wine Store</title>
  <style>
    :root {
      --brand-color: #aa152c;
      --bg-color: #f9f8f6;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 20px 0;
    }
    .card {
      background: white;
      padding: 35px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .brand {
      color: var(--brand-color);
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .subtitle {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    .input-group {
      margin-bottom: 12px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .input-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    .input-group input:focus {
      outline: none;
      border-color: var(--brand-color);
    }
    .btn-submit {
      width: 100%;
      background-color: var(--brand-color);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.3s;
    }
    .btn-submit:hover {
      background-color: #8a1023;
    }
    .message-box {
      margin-top: 15px;
      font-size: 0.9rem;
      display: none;
    }
    .error { color: #d9534f; }
    .success { color: #5cb85c; }
    .link-text {
      margin-top: 18px;
      font-size: 0.9rem;
      color: #666;
    }
    .link-text a {
      color: var(--brand-color);
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand">WINE STORE</div>
    <div class="subtitle">Join us to discover and track your favourite wines</div>
    
    <form id="signupForm">
      <div class="input-group">
        <label for="fullName">Full Name *</label>
        <input type="text" id="fullName" placeholder="John Doe" required>
      </div>
      
      <div class="input-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" placeholder="name@example.com" required>
      </div>

      <div class="input-group">
        <label for="password">Password *</label>
        <input type="password" id="password" placeholder="Create a password" required>
      </div>

      <div class="input-group">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob">
      </div>

      <button type="submit" class="btn-submit">Create Account</button>
    </form>

    <div id="message" class="message-box"></div>

    <div class="link-text">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>

  <script>
    const signupForm = document.getElementById('signupForm');
    const messageDiv = document.getElementById('message');

    signupForm.addEventListener('submit', async function (e) {
      e.preventDefault();

      const payload = {
        fullName: document.getElementById('fullName').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        dob: document.getElementById('dob').value
      };

      try {
        const response = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok) {
          messageDiv.className = "message-box success";
          messageDiv.innerText = "Account created successfully! Redirecting to login...";
          messageDiv.style.display = "block";
          
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1500);
        } else {
          messageDiv.className = "message-box error";
          messageDiv.innerText = data.error || "Failed to sign up.";
          messageDiv.style.display = "block";
        }
      } catch (err) {
        messageDiv.className = "message-box error";
        messageDiv.innerText = "Error connecting to server.";
        messageDiv.style.display = "block";
      }
    });
  </script>

</body>
</html>
